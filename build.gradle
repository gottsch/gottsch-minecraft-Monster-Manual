plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.78'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
}

base {
    archivesName = mod_archive_id
}

// Mojang ships Java 21 to end users starting in 1.20.5, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// gmm registers no game content, so on its own a dev client has nothing to look at. The `testmod`
// source set is a reference consumer (mod id `gmmtest`) that registers every gmm mob and spell. It
// is loaded by the run configs but never packaged into the gmm jar.
sourceSets {
    testmod {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
        resources { srcDir 'src/testmod/generated/resources' }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    testmodImplementation.extendsFrom implementation
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    addModdingDependenciesTo(sourceSets.testmod)

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        gmmtest {
            sourceSet(sourceSets.testmod)
        }
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // headless smoke tests from the testmod (GMMSmokeTests); no EULA needed, unlike runServer
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', "${project.mod_id},gmmtest"
        }

        data {
            data()
            loadedMods = [mods.gmm]
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        testmodData {
            data()
            gameDirectory = project.file('run-testmod-data')
            programArguments.addAll '--mod', 'gmmtest', '--all', '--output', file('src/testmod/generated/resources/').getAbsolutePath(), '--existing', file('src/testmod/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    implementation "gottsch:gottschcore-neoforge-${minecraft_version}:${gottschcore_version}"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version        : minecraft_version,
            minecraft_version_range  : minecraft_version_range,
            neo_version              : neo_version,
            neo_version_range        : neo_version_range,
            loader_version_range     : loader_version_range,
            mod_id                   : mod_id,
            mod_name                 : mod_name,
            mod_license              : mod_license,
            mod_version              : mod_version,
            mod_authors              : mod_authors,
            mod_description          : mod_description,
            gottschcore_version_range: gottschcore_version_range
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = mod_archive_id
            from components.java
        }
    }
    repositories {
        maven {
            name = "localMaven"
            url = "file:///${project.projectDir}/../maven"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('publishAll') {
    group = 'publishing'
    description = 'Publishes to the shared ../maven repo AND to mavenLocal, so neither can go stale.'
    dependsOn 'publish', 'publishToMavenLocal'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
